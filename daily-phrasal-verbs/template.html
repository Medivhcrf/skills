<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>动词词组每日辨析 · 【动词】</title>
<style>
  @page { size: A4; margin: 16mm 15mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Zen Hei', sans-serif;
    font-size: 10.5pt;
    color: #1f2937;
    line-height: 1.65;
  }
  /* 页眉 */
  .header {
    border-bottom: 3px solid #b45309;
    padding-bottom: 10px;
    margin-bottom: 6px;
  }
  .header h1 { font-size: 19pt; color: #92400e; letter-spacing: 1px; }
  .header .meta { color: #6b7280; font-size: 9.5pt; margin-top: 2px; }
  .header .meta b { color: #b45309; }

  /* 分区标题 */
  h2.section {
    font-size: 12.5pt;
    color: #92400e;
    margin: 14px 0 8px 0;
    padding-left: 8px;
    border-left: 4px solid #b45309;
  }

  /* 小词速查表 */
  table.particle {
    width: 100%;
    border-collapse: collapse;
    font-size: 9pt;
    margin-bottom: 12px;
  }
  table.particle th {
    background: #fffbeb;
    color: #92400e;
    border: 1px solid #fcd34d;
    padding: 4px 8px;
    text-align: left;
  }
  table.particle td {
    border: 1px solid #e5e7eb;
    padding: 3px 8px;
  }
  table.particle td b { color: #b45309; }

  /* 词组卡片 */
  .card {
    border: 1px solid #e5e7eb;
    border-left: 4px solid #2563eb;
    border-radius: 6px;
    padding: 8px 12px 9px 12px;
    margin-bottom: 9px;
    page-break-inside: avoid;
  }
  .card .head { margin-bottom: 4px; }
  .card .num {
    display: inline-block;
    width: 17px; height: 17px;
    background: #2563eb; color: #fff;
    border-radius: 50%;
    text-align: center; line-height: 17px;
    font-size: 9pt; font-weight: bold;
    margin-right: 6px;
  }
  .card .phr { font-size: 12.5pt; font-weight: bold; color: #92400e; font-family: 'DejaVu Sans', sans-serif; }
  .card .tag {
    font-size: 8.5pt;
    color: #9ca3af;
    border: 1px solid #e5e7eb;
    border-radius: 3px;
    padding: 0 4px;
    margin-left: 6px;
  }
  .card .mean {
    font-size: 10pt;
    color: #1f2937;
    margin-bottom: 3px;
  }
  .card .logic {
    display: block;
    margin-top: 2px;
    font-size: 9pt;
    color: #6d28d9;
  }
  .card .logic .lab, .card .confuse .lab { font-weight: bold; }
  .card .confuse {
    display: block;
    margin-top: 4px;
    background: #fefce8;
    border: 1px solid #fde047;
    border-radius: 5px;
    padding: 3px 8px;
    font-size: 9pt;
    color: #854d0e;
    line-height: 1.6;
  }
  .card .confuse b { color: #78350f; }
  .card .usage {
    margin-top: 4px;
    background: #eff6ff;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 9.5pt;
    color: #1e40af;
  }
  .card .usage b { color: #1e3a8a; }

  .footer {
    margin-top: 14px;
    text-align: center;
    color: #9ca3af;
    font-size: 8.5pt;
    border-top: 1px solid #e5e7eb;
    padding-top: 6px;
  }
</style>
</head>
<body>

  <h1>动词词组每日辨析 · 【动词】</h1>
