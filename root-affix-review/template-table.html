<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>词根词缀三栏回忆表 · 【标题】</title>
<style>
  @page { size: A4; margin: 14mm 13mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans CJK SC', 'Droid Sans Fallback', 'WenQuanYi Zen Hei', sans-serif;
    font-size: 10pt;
    color: #1f2937;
    line-height: 1.5;
  }
  .header {
    border-bottom: 3px solid #7c3aed;
    padding-bottom: 8px;
    margin-bottom: 8px;
  }
  .header h1 { font-size: 17pt; color: #5b21b6; letter-spacing: 1px; }
  .header .meta { color: #6b7280; font-size: 9pt; margin-top: 2px; }
  .header .meta b { color: #7c3aed; }

  h2.section {
    font-size: 11pt;
    color: #5b21b6;
    margin: 12px 0 5px 0;
    padding-left: 7px;
    border-left: 4px solid #7c3aed;
  }
  h2.section.ans { color: #059669; border-left-color: #059669; }
  h2.hint { color: #6b7280; font-size: 9pt; font-weight: normal; margin: 0 0 6px 0; }

  table.mem { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.mem td { border: 1px solid #e5e7eb; padding: 3px 8px; vertical-align: top; }
  td.root-col {
    width: 17%;
    background: #f5f3ff;
    font-size: 11pt;
    font-weight: bold;
    color: #5b21b6;
    font-family: 'DejaVu Sans', sans-serif;
  }
  td.root-col .no { display: block; font-size: 7.5pt; color: #a78bfa; font-family: 'Noto Sans CJK SC', sans-serif; }
  td.mean-col { width: 32%; }
  td.word-col { width: 51%; }

  /* 练习表的书写格：作业本横线 */
  table.mem:not(.ans) td.mean-col,
  table.mem:not(.ans) td.word-col {
    height: 54px;
    background-image: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 25px, #e7e5e4 25px, #e7e5e4 26px);
  }

  /* 词缀行绿色 */
  tr.affix td.root-col { background: #ecfdf5; color: #065f46; }
  tr.affix td.root-col .no { color: #6ee7b7; }

  /* 答案表：紧凑小字 */
  table.mem.ans td { height: auto; padding: 2px 8px; font-size: 8.5pt; }
  table.mem.ans td.mean-col { color: #4b5563; }
  table.mem.ans td.word-col { color: #111827; line-height: 1.5; }

  .footer {
    margin-top: 12px;
    text-align: center;
    color: #9ca3af;
    font-size: 8pt;
    border-top: 1px solid #e5e7eb;
    padding-top: 5px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>词根词缀三栏回忆表 · 【标题】</h1>
  <div class="meta">【统计】</div>
</div>

<h2 class="hint">书写提示：① 看词根，写出它的含义　② 写出 2-3 个代表词（写不出的先留空，最后统一对答案）</h2>

【练习内容】

<h2 class="section ans">答案区（编号与练习一一对应，可折页对照）</h2>
【答案内容】

<div class="footer">词根词缀三栏回忆表 · 学而时习之 · 不亦说乎 👋</div>

</body>
</html>
